# Reverse Proxy (Nginx auf dem Host) für den Urlaubsplaner. urlaub.example.org durch die eigene Domain ersetzen.
# Einrichten (als root):
#   cp /opt/urlaub/betrieb/nginx-urlaub.conf /etc/nginx/sites-available/urlaub.example.org
#   ln -s /etc/nginx/sites-available/urlaub.example.org /etc/nginx/sites-enabled/
#   Zuerst nur den Block für Port 80 aktiv lassen, Zertifikat holen:
#   certbot certonly --webroot -w /var/www/html -d urlaub.example.org
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name urlaub.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name urlaub.example.org;

    ssl_certificate     /etc/letsencrypt/live/urlaub.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/urlaub.example.org/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;            # PDF-Erzeugung, Routing
    }
}
