<div class="teilen-knoepfe">
  <a class="knopf whatsapp" href="{{ f.whatsapp }}" target="_blank" rel="noopener">WhatsApp</a>
  <a class="knopf zweit" href="{{ f.email }}">E-Mail</a>
  <button type="button" class="knopf zweit" data-kopieren="{{ f.link }}">Link kopieren</button>
  <button type="button" class="knopf zweit" data-teilen="{{ f.link }}" data-titel="{{ f.titel }}" data-text="{{ f.nachricht }}" hidden>Teilen …</button>
</div>
